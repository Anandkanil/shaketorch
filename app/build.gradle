plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anjaly.shaketorch'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anjaly.shaketorch'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries needed — the app uses only built-in Android APIs.
dependencies {
}
